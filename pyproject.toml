[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridex"
version = "0.3.0"
description = "Reference validation and provenance auditing: catches fabricated, mis-cited, retracted or corrupted references. Stdlib-only core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Madeesh P. Nissanka" }]
keywords = ["references", "bibliography", "provenance", "retraction", "citation", "validation", "crossref", "openalex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
semantic = ["sentence-transformers>=2.2"]

[project.scripts]
veridex = "veridex.cli:main"

[project.urls]
Homepage = "https://github.com/madeesh-nissanka/veridex"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
