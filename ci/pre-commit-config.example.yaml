# Copy to .pre-commit-config.yaml in a project that cites references.
repos:
  - repo: local
    hooks:
      - id: veridex-audit
        name: veridex audit
        entry: veridex audit
        language: system
        files: \.(bib|ris|txt)$
        args: ["--policy", "examples/policy.yaml", "--format", "text"]
